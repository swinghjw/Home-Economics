 .result-scores{background:#fcfafd;border:1px solid #efe6f4;border-radius:14px;padding:12px 13px;display:grid;gap:9px}

function selectEnding(){
 const [t,e,v]=state.stats,avg=(t+e+v)/3,h=state.history;
 const picks=n=>h.filter(x=>x.choice===n).length;
 const choices=h.map(x=>x.choice),n=choices.length;
 const last=h.filter(x=>x.ep===episodes.length-1).map(x=>x.choice);
 if(avg>=78&&Math.min(t,e,v)>=65)return endingTypes[0];
 if(v>=e+9&&v>=t+5&&v>=52)return endingTypes[1];
 if(e>=v+9&&e>=t+5&&e>=52)return endingTypes[2];
 if(t>=v+9&&t>=e+5&&t>=52)return endingTypes[3];
 if(picks(2)>=Math.ceil(n*.42)&&v>=45&&avg>=48)return endingTypes[4];
 if(avg>=62&&picks(1)>=Math.ceil(n*.27))return endingTypes[5];
 if(avg>=43&&picks(2)>=Math.ceil(n*.24))return endingTypes[6];
 if(v<43&&t>=40)return endingTypes[7];
 if(avg<43)return endingTypes[8];
 if(picks(1)>=Math.ceil(n*.30))return endingTypes[5];
 return last.includes(0)?endingTypes[6]:endingTypes[8];
}

function teacherLogin(){ask('교사용 관리자 모드','교사용 비밀번호를 입력해 주세요. (기본값: 0000)',true,(ok,p)=>{if(!ok)return;if(p==='0000'){mode='teacher';renderEditor()}else showToast('비밀번호가 일치하지 않습니다.')})}
function renderEditor(){mode='teacher';const e=episodes[editEp]||episodes[0];editEp=Math.max(0,Math.min(editEp,episodes.length-1));editScene=Math.max(0,Math.min(editScene,e.scenes.length-1));const s=e.scenes[editScene];view.innerHTML=`<section class="card teacher"><div class="row" style="justify-content:space-between"><div><h2>⚙ 교사용 이야기 편집실</h2><p>에피소드의 대사·선택지·반응·학습 해설·점수를 수정할 수 있어요.</p></div><button class="btn pink" id="exitEditor">게임으로 돌아가기</button></div><div class="note">이 화면에서 저장한 수정 내용은 <strong>현재 브라우저에만</strong> 적용됩니다. 학생에게 같은 내용을 배포하려면 아래의 JSON 내보내기로 설정 파일을 저장한 뒤, 학생 기기에 가져오거나 HTML에 반영해 다시 배포해야 합니다. 기본 비밀번호(0000)는 간편한 편집용이며 보안 인증이 아닙니다.</div><div class="row" style="margin:20px 0"><button class="btn primary" id="saveEditor">💾 현재 수정 저장</button><button class="btn" id="export">⬇ 설정 JSON 내보내기</button><button class="btn" id="import">⬆ 설정 JSON 가져오기</button><button class="btn" id="resetEditor">↻ 기본 이야기 복원</button></div><div class="editorgrid"><nav class="editnav">${episodes.map((x,i)=>`<button class="btn ${i===editEp?'active':''}" data-ep="${i}">${i+1}. ${esc(x.title)}</button>`).join('')}</nav><div><div class="field"><label>에피소드 제목</label><input id="epTitle" value="${esc(e.title)}"></div><div class="field"><label>학습 주제 (부제)</label><input id="epSubtitle" value="${esc(e.subtitle)}"></div><div class="field"><label>배경 장소</label><select id="epPlace">${[['living','거실'],['kitchen','주방'],['bedroom','방'],['park','공원'],['hall','복도']].map(([v,t])=>`<option value="${v}" ${e.place===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="row" style="margin:15px 0"><label style="font-weight:900">편집 장면:</label>${e.scenes.map((_,i)=>`<button class="btn ${i===editScene?'active':''}" data-scene="${i}">${i+1}</button>`).join('')}</div><div class="field"><label>말하는 사람</label><input id="speaker" value="${esc(s.speaker)}"></div><div class="field"><label>대사</label><textarea id="line">${esc(s.line)}</textarea></div><div class="field"><label>상황 설명</label><textarea id="context">${esc(s.context)}</textarea></div><div class="field"><label>등장인물 (쉼표로 구분: 엄마, 아빠, 동생, 나)</label><input id="actors" value="${esc(s.actors.join(', '))}"></div><h3>선택지와 결과 (장면당 5개)</h3>${s.choices.map((c,i)=>`<div class="choiceedit"><strong>선택지 ${i+1}</strong><div class="field"><label>학생이 고를 대사</label><textarea data-f="text" data-ci="${i}">${esc(c.text)}</textarea></div><div class="field"><label>가족 반응 / 결과</label><textarea data-f="reply" data-ci="${i}">${esc(c.reply)}</textarea></div><div class="field"><label>학습 해설</label><textarea data-f="explain" data-ci="${i}">${esc(c.explain)}</textarea></div><div class="field"><label>관계 지수 변화 (신뢰, 공감, 자기표현; 예: 3, 2, -1)</label><input data-f="delta" data-ci="${i}" value="${c.delta.join(', ')}"></div></div>`).join('')}<button class="btn primary" id="saveBottom">💾 현재 수정 저장</button></div></div><input class="hidden" id="importFile" type="file" accept=".json,application/json"></section>`;document.querySelector('#exitEditor').onclick=()=>state?render():home();document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{saveEditor(false);editEp=+b.dataset.ep;editScene=0;renderEditor()});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{saveEditor(false);editScene=+b.dataset.scene;renderEditor()});document.querySelector('#saveEditor').onclick=()=>saveEditor(true);document.querySelector('#saveBottom').onclick=()=>saveEditor(true);document.querySelector('#export').onclick=()=>{saveEditor(false);download('우리_가족의_하루_교사용_설정.json',JSON.stringify(episodes,null,2),'application/json');showToast('설정 JSON 파일을 내보냈습니다.')};document.querySelector('#import').onclick=()=>document.querySelector('#importFile').click();document.querySelector('#importFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!validate(data))throw Error('필수 필드 또는 선택지 형식 오류');episodes=clone(data);localStorage.setItem(CUSTOM,JSON.stringify(episodes));editEp=0;editScene=0;state=null;localStorage.removeItem(SAVE);renderEditor();showToast('설정 파일을 가져왔습니다. 진행 기록은 초기화되었습니다.')}catch(e){showToast('가져오기 실패: '+e.message)}};document.querySelector('#resetEditor').onclick=()=>ask('기본 이야기 복원','모든 교사용 수정 내용이 삭제되고 현재 학생 진행 기록도 초기화됩니다. 복원할까요?',false,ok=>{if(!ok)return;episodes=clone(baseEpisodes);localStorage.removeItem(CUSTOM);localStorage.removeItem(SAVE);state=null;editEp=0;editScene=0;renderEditor();showToast('기본 이야기로 복원했습니다.')})}
function saveEditor(notify){const e=episodes[editEp],s=e.scenes[editScene];e.title=document.querySelector('#epTitle').value.trim()||e.title;e.subtitle=document.querySelector('#epSubtitle').value.trim()||e.subtitle;e.place=document.querySelector('#epPlace').value;s.speaker=document.querySelector('#speaker').value.trim()||s.speaker;s.line=document.querySelector('#line').value.trim()||s.line;s.context=document.querySelector('#context').value.trim()||s.context;s.actors=document.querySelector('#actors').value.split(',').map(x=>x.trim()).filter(Boolean);for(let i=0;i<s.choices.length;i++){const c=s.choices[i];for(let f of ['text','reply','explain'])c[f]=document.querySelector(`[data-f="${f}"][data-ci="${i}"]`).value.trim()||c[f];const raw=document.querySelector(`[data-f="delta"][data-ci="${i}"]`).value.split(',').map(x=>Number(x.trim()));if(raw.length===3&&raw.every(Number.isFinite))c.delta=raw;else{showToast(`선택지 ${i+1}의 관계 지수는 숫자 3개여야 합니다.`);return false}}localStorage.setItem(CUSTOM,JSON.stringify(episodes));if(notify)showToast('이야기 수정 내용을 저장했습니다.');return true}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#teacherBtn').onclick=teacherLogin;document.querySelector('#homeBtn').onclick=home;
home();
</script>
</body></html>

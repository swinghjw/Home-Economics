<script id="initialData" type="application/json">[]</script>
<script id="siteSettings" type="application/json">{"title":"내가 만드는 나의 삶","intro":"게임과 활동지, 다양한 기술·가정 수업자료를 한곳에서 만나보세요."}</script>
<script id="menuData" type="application/json">[{"id":"games","name":"온라인 게임","icon":"🎮"},{"id":"worksheets","name":"활동지","icon":"📝"},{"id":"materials","name":"수업자료","icon":"📚"}]</script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), root=$('#modalRoot');
const initial=JSON.parse($('#initialData').textContent), initialSettings=JSON.parse($('#siteSettings').textContent);
const defaults=[{id:'games',name:'온라인 게임',icon:'🎮'},{id:'worksheets',name:'활동지',icon:'📝'},{id:'materials',name:'수업자료',icon:'📚'}];
const KEY='tech_home_site_edit_v1', SETTINGS_KEY='tech_home_site_settings_v1', MENU_KEY='tech_home_site_menus_v1';
const stored=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
let data=stored(KEY,initial).filter(x=>x.id!=='game-1'),siteSettings={...initialSettings,...stored(SETTINGS_KEY,{})},menus=stored(MENU_KEY,JSON.parse($('#menuData').textContent));
if(!Array.isArray(menus)||!menus.length)menus=structuredClone(defaults);
const menuFor=x=>x.menuId&&menus.some(m=>m.id===x.menuId)?x.menuId:(x.type==='온라인 게임'?'games':x.type==='활동지'?'worksheets':'materials');
data=data.map(x=>({...x,menuId:menuFor(x)}));
let current='all',unlocked=false,editing=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(s){try{const u=new URL(s,location.href);return ['https:','http:'].includes(u.protocol)}catch{return false}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(siteSettings));render()}
function saveMenus(){localStorage.setItem(MENU_KEY,JSON.stringify(menus));render()}
function render(){
 $('#siteTitle').textContent=siteSettings.title;$('#siteIntro').textContent=siteSettings.intro;$('#footerTitle').textContent=siteSettings.title;document.title=siteSettings.title+' | 기술·가정 수업자료실';
 const publicData=data.filter(x=>x.visible!==false);
 $('#sidebarMenus').innerHTML=`<button class="side-link ${current==='all'?'active':''}" data-menu="all"><span>✨</span><span>전체 자료</span><b>${publicData.length}</b></button>`+menus.map(m=>`<button class="side-link ${current===m.id?'active':''}" data-menu="${esc(m.id)}"><span>${esc(m.icon||'📁')}</span><span>${esc(m.name)}</span><b>${publicData.filter(x=>menuFor(x)===m.id).length}</b></button>`).join('');
 $('#sidebarMenus').querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{current=b.dataset.menu;render();document.querySelector('.resources').scrollIntoView({behavior:'smooth',block:'start'})});
 const selected=menus.find(m=>m.id===current);$('#sectionTitle').textContent=selected?`${selected.icon||'📁'} ${selected.name}`:'✨ 전체 자료';
 const shown=publicData.filter(x=>current==='all'||menuFor(x)===current);
 $('#cards').innerHTML=shown.map((x,i)=>{
 const thumb=x.thumbnailUrl||'';const colors=['#ffe6f1','#e3f7ee','#f0eaff','#fff3d8'];
 const art=thumb?`<div class="art has-image"><img src="${esc(thumb)}" alt="${esc(x.title)} 썸네일" loading="lazy"></div>`:`<div class="art" style="background:${colors[i%colors.length]}"><span class="emoji">${esc(x.type==='온라인 게임'?'🎮':x.type==='활동지'?'📝':'📚')}</span></div>`;
 return `<article class="card">${art}<div class="body"><div class="meta">${esc(x.grade||'전체 학년')} · ${esc(x.type||'자료')}</div><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p><div class="row"><button class="btn primary" data-open="${esc(x.id)}">${x.type==='온라인 게임'?'게임 참여하기':'자료 열기'} →</button></div></div></article>`}).join('')||'<div class="empty">이 메뉴에 공개된 자료가 없습니다.</div>';
 $('#cards').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=data.find(y=>y.id===b.dataset.open);if(x&&safeUrl(x.url))window.open(new URL(x.url,location.href).href,'_blank','noopener,noreferrer');else alert('자료 주소를 확인해주세요.')});
}
function close(){root.innerHTML=''}
function modal(title,body){root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button class="btn" id="closeModal">닫기 ✕</button></div>${body}</div></div>`;$('#closeModal').onclick=close;root.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()}}
$('#adminOpen').onclick=()=>{if(unlocked)return panel();modal('교사용 자료 관리',`<p class="help">관리자 비밀번호를 입력하세요.</p><form id="pinForm" class="row"><input id="pin" type="password" placeholder="비밀번호" required><button class="btn primary">입장</button></form><p id="pinError" class="error"></p>`);$('#pinForm').onsubmit=e=>{e.preventDefault();if($('#pin').value!=='0000'){$('#pinError').textContent='비밀번호를 확인하세요.';return}unlocked=true;panel()}}
function menuOptions(value){return menus.map(m=>`<option value="${esc(m.id)}" ${m.id===value?'selected':''}>${esc(m.icon||'📁')} ${esc(m.name)}</option>`).join('')}
function panel(){modal('교사용 자료관리',`<p class="notice">변경 내용은 현재 브라우저에 저장됩니다. 학생에게 공개하려면 <b>HTML 내보내기</b> 후 GitHub의 index.html을 교체하세요.</p><div class="admin-actions"><button class="btn primary" id="editSite">✎ 제목·소개 수정</button><button class="btn" id="manageMenus">☷ 메뉴 관리</button><button class="btn primary" id="addResource">＋ 자료 추가</button><button class="btn" id="exportPage">⬇ HTML 내보내기</button><button class="btn" id="resetAll">초기화</button></div><p class="help admin-caption">자료의 '이동할 메뉴'를 바꾸면 다른 메뉴로 바로 옮길 수 있어요.</p><div id="manageList"></div>`);
 $('#editSite').onclick=editSite;$('#manageMenus').onclick=manageMenus;$('#addResource').onclick=()=>resourceForm();$('#exportPage').onclick=exportHTML;
 $('#resetAll').onclick=()=>{if(confirm('모든 로컬 수정 내용을 초기화할까요?')){data=structuredClone(initial).map(x=>({...x,menuId:menuFor(x)}));siteSettings={...initialSettings};menus=structuredClone(defaults);localStorage.removeItem(SETTINGS_KEY);localStorage.removeItem(MENU_KEY);localStorage.removeItem(KEY);render();panel()}};
 $('#manageList').innerHTML=data.map(x=>`<div class="manage"><div class="manage-title"><strong>${esc(x.title)}</strong><small>${esc(x.type)} · ${x.visible===false?'비공개':'공개'}</small></div><div class="manage-controls"><label class="mini-label">이동할 메뉴 <select data-move="${esc(x.id)}">${menuOptions(menuFor(x))}</select></label><button class="btn" data-edit="${esc(x.id)}">수정</button><button class="btn red" data-del="${esc(x.id)}">삭제</button></div></div>`).join('')||'<p>등록된 자료가 없습니다.</p>';
 root.querySelectorAll('[data-move]').forEach(s=>s.onchange=()=>{const x=data.find(x=>x.id===s.dataset.move);if(x){x.menuId=s.value;save();panel()}});
 root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>resourceForm(data.find(x=>x.id===b.dataset.edit)));
 root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('자료를 삭제하시겠습니까?')){data=data.filter(x=>x.id!==b.dataset.del);save();panel()}});
}
function editSite(){modal('홈페이지 제목·소개 수정',`<form class="formgrid" id="siteForm"><label class="field full">홈페이지 제목<input id="sTitle" maxlength="100" required value="${esc(siteSettings.title)}"></label><label class="field full">소개 문구<textarea id="sIntro" maxlength="500">${esc(siteSettings.intro)}</textarea></label><div class="row full"><button class="btn" type="button" id="back">취소</button><button class="btn primary">저장하기</button></div></form>`);$('#back').onclick=panel;$('#siteForm').onsubmit=e=>{e.preventDefault();if(!$('#sTitle').value.trim())return;siteSettings={title:$('#sTitle').value.trim(),intro:$('#sIntro').value.trim()};saveSettings();panel()}}
function manageMenus(){modal('메뉴 관리',`<p class="help">메뉴 이름·아이콘을 변경하거나 순서를 조정할 수 있습니다. 메뉴를 삭제하면 그 메뉴에 있던 자료는 다른 메뉴로 옮겨집니다.</p><div id="menuManager"></div><form id="menuForm" class="add-menu-form"><label class="field">메뉴 아이콘<input id="newIcon" maxlength="4" placeholder="📁" value="📁"></label><label class="field">새 메뉴 이름<input id="newName" maxlength="28" placeholder="예: 주생활 게임" required></label><button class="btn primary" type="submit">＋ 메뉴 추가</button></form><div class="row" style="margin-top:18px"><button class="btn" id="back">자료관리로 돌아가기</button></div>`);$('#back').onclick=panel;$('#menuForm').onsubmit=e=>{e.preventDefault();const name=$('#newName').value.trim();if(!name)return;menus.push({id:'m'+Date.now(),name,icon:$('#newIcon').value.trim()||'📁'});saveMenus();manageMenus()};drawMenuManager()}
function drawMenuManager(){const holder=$('#menuManager');if(!holder)return;holder.innerHTML=menus.map((m,i)=>`<div class="menu-manage-row"><span class="menu-name">${esc(m.icon)} ${esc(m.name)}</span><div class="actions"><button class="btn tiny" data-up="${esc(m.id)}" ${i===0?'disabled':''} title="위로">↑</button><button class="btn tiny" data-down="${esc(m.id)}" ${i===menus.length-1?'disabled':''} title="아래로">↓</button><button class="btn tiny" data-rename="${esc(m.id)}">수정</button><button class="btn tiny red" data-remove="${esc(m.id)}" ${menus.length===1?'disabled':''}>삭제</button></div></div>`).join('');
 holder.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const id=b.dataset.up||b.dataset.down,i=menus.findIndex(m=>m.id===id),j=i+(b.dataset.up?-1:1);if(j<0||j>=menus.length)return;[menus[i],menus[j]]=[menus[j],menus[i]];saveMenus();drawMenuManager()});
 holder.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{const m=menus.find(m=>m.id===b.dataset.rename);const name=prompt('메뉴 이름을 입력하세요.',m.name);if(name===null)return;if(!name.trim())return alert('메뉴 이름을 입력하세요.');const icon=prompt('메뉴 아이콘(이모지)을 입력하세요.',m.icon);if(icon===null)return;m.name=name.trim().slice(0,28);m.icon=icon.trim().slice(0,4)||'📁';saveMenus();drawMenuManager()});
 holder.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const index=menus.findIndex(m=>m.id===b.dataset.remove),m=menus[index];if(menus.length<2)return;const target=menus.find(x=>x.id!==m.id);if(!confirm(`'${m.name}' 메뉴를 삭제하고 그 안의 자료를 '${target.name}' 메뉴로 이동할까요?`))return;data.forEach(x=>{if(menuFor(x)===m.id)x.menuId=target.id});menus.splice(index,1);if(current===m.id)current='all';save();saveMenus();drawMenuManager()});
}
function resourceForm(x){editing=x?.id||null;modal(x?'자료 수정':'새 자료 추가',`<form id="resourceForm" class="formgrid"><label class="field full">자료명 *<input id="rTitle" maxlength="100" required value="${esc(x?.title)}"></label><label class="field">메뉴<select id="rMenu">${menuOptions(x?menuFor(x):(current==='all'?menus[0].id:current))}</select></label><label class="field">자료 유형<select id="rType">${['온라인 게임','활동지','수업자료','퀴즈','영상','기타'].map(t=>`<option ${x?.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">대상 학년<select id="rGrade">${['중학교','고등학교','전체 학년'].map(t=>`<option ${(x?.grade||'중학교')===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field full">자료 설명<textarea id="rDesc">${esc(x?.description)}</textarea></label><label class="field full">썸네일 이미지 주소 (선택)<input id="rThumb" value="${esc(x?.thumbnailUrl)}" placeholder="https://..."></label><label class="field full">게임·자료 URL<input id="rUrl" value="${esc(x?.url)}" placeholder="https://..." required></label><label class="row full"><input type="checkbox" id="rVisible" ${x?.visible===false?'':'checked'}> 학생에게 공개</label><div id="formError" class="error full"></div><div class="row full"><button type="button" class="btn" id="back">취소</button><button class="btn primary">저장하기</button></div></form>`);$('#back').onclick=panel;$('#resourceForm').onsubmit=e=>{e.preventDefault();const obj={...x,id:editing||('r'+Date.now()),title:$('#rTitle').value.trim(),menuId:$('#rMenu').value,type:$('#rType').value,grade:$('#rGrade').value,description:$('#rDesc').value.trim(),thumbnailUrl:$('#rThumb').value.trim(),url:$('#rUrl').value.trim(),visible:$('#rVisible').checked};
 if(!safeUrl(obj.url)){ $('#formError').textContent='올바른 게임·자료 URL을 입력해주세요.';return}
 if(obj.thumbnailUrl&&!safeUrl(obj.thumbnailUrl)){$('#formError').textContent='썸네일은 올바른 이미지 URL을 입력해주세요.';return}
 if(editing)data=data.map(y=>y.id===editing?obj:y);else data.push(obj);save();panel()}}
